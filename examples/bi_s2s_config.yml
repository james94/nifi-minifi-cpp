Flow Controller:
  name: MiNiFi CPP Bidirectional SiteToSite
Processors:
  - name: GetFile
    class: org.apache.nifi.processors.standard.GetFile
    max concurrent tasks: 1
    scheduling strategy: TIMER_DRIVEN
    scheduling period: 10 sec
    penalization period: 30 sec
    yield period: 1 sec
    run duration nanos: 0
    auto-terminated relationships list:
    Properties:
      Input Directory: /opt/minifi/minifi-current/data/input/traffic_congest
      Keep Source File: true
  - name: PutFile
    class: org.apache.nifi.processors.standard.PutFile
    auto-terminated relationships list:
      - success
      - failure
    penalization period: 30 sec
    run duration nanos: 0
    scheduling period: 1 sec
    scheduling strategy: EVENT_DRIVEN
    yield period: 1 sec
    Properties:
      # Use actual MINIFI_HOME path observed in logs
      Directory:  /opt/minifi/minifi-current/data/output
      Create Missing Directories: true
      Conflict Resolution Strategy: replace
Connections:
  - name: TransferMiNiFiToNiFiRpg
    source name: GetFile
    source relationship name: success
    destination name: FromMiNiFiAgent1
    destination id: fbe5c098-019b-1000-f414-3bd10079fcd5
    max work queue size: 0
    max work queue data size: 1 MB
    flowfile expiration: 60 sec
  - name: TransferNiFiRpgToMiNiFi
    source name: ToMiNiFiAgent1
    source id: fbe5f8e5-019b-1000-0677-e8133da42b41
    source relationship name: undefined # NOTE: NiFi to MiNiFi S2S where "undefined" allows receive flow file transmit it to next MiNiFi processor
    destination name: PutFile
Remote Processing Groups:
  - name: NiFi RPG Flow
    url: http://nifi:8080/nifi
    timeout: 30 sec
    yield period: 10 sec
    transport protocol: RAW
    Input Ports:
      - name: FromMiNiFiAgent1
        max concurrent tasks: 1
        id: fbe5c098-019b-1000-f414-3bd10079fcd5 # input port id from NiFi
        Properties:
            Port: 10000
            Host Name: nifi
    Output Ports:
      - name: ToMiNiFiAgent1
        max concurrent tasks: 1
        id: fbe5f8e5-019b-1000-0677-e8133da42b41 # output port id in NiFi
        Properties:
            Port: 10000
            Host Name: nifi
